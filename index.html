<html lang="en">
<head>

  <link rel="apple-touch-icon" href="https://mhamednagem2004-debug.github.io/peetx/logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://mhamednagem2004-debug.github.io/peetx/logo.png" />

  <link rel="apple-touch-icon-precomposed" href="https://mhamednagem2004-debug.github.io/peetx/logo.png" />

  <link rel="manifest" href="manifest.json" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="PeetX - Trading & Investment Platform" />
  <meta property="og:description" content="Decentralized Trading Platform Powered by TradingView" />
  <meta property="og:site_name" content="PeetX" />
  <meta property="og:url" content="https://mhamednagem2004-debug.github.io/peetx/" />
  <meta property="og:image" content="https://mhamednagem2004-debug.github.io/peetx/logo.png" />
  <meta property="og:image:secure_url" content="https://mhamednagem2004-debug.github.io/peetx/logo.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PeetX - Trading & Investment Platform" />

  <meta name="twitter:image" content="https://mhamednagem2004-debug.github.io/peetx/logo.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 60px;
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
    }
    .brand h1 {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .wallet-btn {
      background-color: #238636;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .wallet-btn:hover {
      background-color: #2ea043;
    }
    main {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
    }
    .tradingview-widget-container {
      height: 100%;
      width: 100%;
    }
    #tradingview_chart {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="https://mhamednagem2004-debug.github.io/peetx/logo.png" alt="PeetX Logo" />
      <h1>PeetX</h1>
    </div>
    <button class="wallet-btn" id="connectWalletBtn">Connect Wallet</button>
  </header>

  <main>
    <div class="tradingview-widget-container">
      <div id="tradingview_chart"></div>
    </div>
  </main>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    new TradingView.widget({
      "autosize": true,
      "symbol": "BINANCE:BTCUSDT",
      "interval": "D",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#161b22",
      "enable_publishing": false,
      "allow_symbol_change": true,
      "container_id": "tradingview_chart"
    });

    const metadata = {
      name: 'PeetX',
      description: 'Decentralized Trading & Investment Platform',
      url: 'https://mhamednagem2004-debug.github.io/peetx/',
      icons: ['https://mhamednagem2004-debug.github.io/peetx/logo.png']
    };
  </script>

</body>
</html>
